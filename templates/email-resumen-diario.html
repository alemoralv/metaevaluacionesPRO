<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumen Diario - MetaEvaluaciones PRO</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#222;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7fb;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="640" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

          <!-- Header -->
          <tr>
            <td style="background-color:#004a99;padding:28px 32px;">
              <p style="margin:0;font-size:20px;font-weight:bold;color:#ffffff;letter-spacing:0.5px;">
                MetaEvaluaciones PRO
              </p>
              <p style="margin:6px 0 0;font-size:14px;color:#c8ddf5;">
                Resumen Diario de Evaluaciones
              </p>
            </td>
          </tr>

          <!-- Date + count -->
          <tr>
            <td style="padding:24px 32px 0;">
              <p style="margin:0;font-size:22px;font-weight:bold;color:#004a99;">{{DATE}}</p>
              <p style="margin:6px 0 0;font-size:14px;color:#555;">
                Total de evaluaciones realizadas hoy:
                <strong style="color:#004a99;">{{EVALUATION_COUNT}}</strong>
              </p>
              <hr style="border:none;border-top:3px solid #ffc20e;margin:16px 0 0;" />
            </td>
          </tr>

          <!-- Evaluations block -->
          <tr>
            <td style="padding:16px 32px 24px;">
              {{EVALUATIONS_HTML}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f0f4fa;padding:16px 32px;border-top:1px solid #dde5f0;">
              <p style="margin:0;font-size:12px;color:#888;">
                Generado automáticamente por MetaEvaluaciones PRO el {{GENERATED_AT}}.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
